# Scheduled scan + (optional) GitHub Pages deploy.
#
# Split into two jobs on purpose:
#
#   scan    - checks out, runs scanner.py, commits the refreshed
#             deals.json, and uploads the dashboard/ directory as a
#             Pages artifact. NO `environment:` block, so a Pages
#             failure downstream can't take the scan job red.
#
#   deploy  - needs: scan. Runs configure-pages + deploy-pages in
#             its own job with the github-pages environment. If
#             Pages isn't enabled on the repo, this job goes yellow
#             (continue-on-error) but the scan job stays green and
#             deals.json still gets committed.
#
# One-time setup required from you (can't be done from code):
#   A. Settings -> Pages -> Source: "GitHub Actions". The default
#      GITHUB_TOKEN isn't allowed to create Pages sites via the REST
#      API even with pages:write -- the site has to exist before
#      actions/deploy-pages can push to it. Click this once and
#      you're done.
#   B. Merge this branch to main (or the workflow never fires on
#      schedule -- cron only respects the default branch).
#   C. Actions tab -> "Scan flights and deploy dashboard" -> Run
#      workflow to trigger the first run immediately instead of
#      waiting for cron.
#   D. (Optional, for phone alerts) Create a Discord webhook in any
#      server you control (Server Settings -> Integrations -> Webhooks
#      -> New Webhook -> Copy Webhook URL) and add it as a repo secret
#      named NOTIFY_DISCORD_WEBHOOK_URL. To change the alert threshold
#      from the EUR 80 default, set a repo variable NOTIFY_PRICE_CAP_EUR.
#
# After that it runs itself on a 6-hour cadence. The Pages URL appears
# on every deploy job's run summary -- bookmark it.

name: Scan flights and deploy dashboard

on:
  schedule:
    # Every 6 hours at :05 past. Offset from :00 to avoid the cron
    # thundering herd on GitHub's shared runners.
    - cron: '5 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scanner.py'
      - 'notifier.py'
      - 'requirements.txt'
      - 'dashboard/index.html'
      - 'dashboard/app.js'
      - 'dashboard/styles.css'
      - '.github/workflows/scan-and-deploy.yml'
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send ONE fake Discord test message instead of running a scan"
        type: boolean
        default: false

# Let a new run cancel a stale deploy, but never cancel an in-progress
# deploy itself -- that can leave Pages in a half-updated state.
concurrency:
  group: scan-and-deploy
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # for the deals.json commit-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the pull-rebase-retry in the commit step has
          # enough to rebase our deals.json commit onto if the push race
          # with a concurrent push kicks in.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          # Both are optional -- missing secret/var => scanner simply
          # skips the Discord notification step with a no-op log line.
          NOTIFY_DISCORD_WEBHOOK_URL: ${{ secrets.NOTIFY_DISCORD_WEBHOOK_URL }}
          NOTIFY_PRICE_CAP_EUR: ${{ vars.NOTIFY_PRICE_CAP_EUR }}
        run: |
          if [ "${{ github.event.inputs.test_notification }}" = "true" ]; then
            echo "::notice::Running in test-notification mode -- no scan, just a fake Discord message."
            python scanner.py --test-notification
          else
            python scanner.py
          fi

      - name: Commit refreshed deals.json (if changed)
        if: github.event.inputs.test_notification != 'true'
        # Non-fatal: a lost race on the push shouldn't stop the Pages
        # artifact upload from happening with a freshly-generated dashboard.
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/deals.json
          if git diff --cached --quiet; then
            echo "No deals.json changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh deals.json [skip ci]"

          branch="${GITHUB_REF_NAME}"
          if git push origin "HEAD:${branch}"; then
            echo "Fast-forward push succeeded."
            exit 0
          fi
          echo "Initial push rejected -- rebasing onto latest ${branch}..."
          if ! git pull --rebase --autostash origin "${branch}"; then
            echo "::warning::Rebase failed; skipping commit this run. The next cron tick will try again."
            exit 0
          fi
          if git push origin "HEAD:${branch}"; then
            echo "Push succeeded after rebase."
            exit 0
          fi
          echo "::warning::Push still rejected after rebase; skipping commit this run."
          exit 0

      - name: Upload dashboard as Pages artifact
        if: github.event.inputs.test_notification != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: scan
    # Skip the Pages deploy entirely in test-notification mode -- nothing
    # to publish, and we don't want to re-deploy the dashboard just for a
    # webhook test.
    if: github.event.inputs.test_notification != 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write     # deploy-pages needs this
      id-token: write  # for OIDC auth to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # The whole job is non-fatal. If Pages hasn't been enabled in repo
    # Settings yet, every step here will fail/skip cleanly but the
    # workflow as a whole still shows the scan job as green success.
    continue-on-error: true

    steps:
      - name: Configure GitHub Pages
        id: configure_pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        if: steps.configure_pages.outcome == 'success'
        id: deploy
        uses: actions/deploy-pages@v4
