<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Weekend Flights">
  <title>Weekend Getaway Flight Scanner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-main">
      <h1>Weekend Getaway Flight Scanner</h1>
      <p class="subtitle">
        Friday evening &rarr; Sunday evening &middot;
        Shannon, Dublin &amp; Birmingham &rarr; Europe &middot;
        Ryanair + Aer Lingus &middot;
        <span class="cap">Fri 16:00+ / Sun 15:00+</span>
        <span class="build-tag" id="build-tag">dashboard v9</span>
      </p>
    </div>
    <p class="meta" id="meta">Loading deals&hellip;</p>
    <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle deal list">
      <span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </button>
  </header>

  <main>
    <div id="map"></div>
    <aside id="sidebar">
      <div class="sidebar-header">
        <h2 id="deals-title">Trip Ideas</h2>
        <button id="clear-destination" class="clear-dest-btn" style="display:none;">
          &larr; show all destinations
        </button>
        <button id="recommend-me" class="recommend-btn">
          &#127793; Surprise me with 3 ideas
        </button>
        <button id="open-compare" class="compare-tray-btn" style="display:none;">
          &#x1F4CA; Compare <span id="compare-count">0</span>
        </button>
        <div class="search-row">
          <input type="search" id="search-box" placeholder="Where to? (e.g. barcelona, italy, BCN)" autocomplete="off" spellcheck="false">
        </div>
        <div class="filters">
          <label>
            <input type="checkbox" id="filter-snn" checked>
            <span class="dot snn"></span> Shannon
          </label>
          <label>
            <input type="checkbox" id="filter-dub" checked>
            <span class="dot dub"></span> Dublin <span class="muted">(+&euro;30 bus)</span>
          </label>
          <label>
            <input type="checkbox" id="filter-bhx" checked>
            <span class="dot bhx"></span> Birmingham
          </label>
        </div>
        <div class="region-chips" id="region-chips">
          <!-- populated from payload.deals at render time -->
        </div>
        <div class="price-slider-row">
          <label>
            Max price
            <span id="price-max-label">&euro;100</span>
          </label>
          <input type="range" id="price-max" min="20" max="150" step="5" value="100">
          <div class="slider-ticks">
            <span>&euro;20</span>
            <span>&euro;150</span>
          </div>
        </div>
        <div class="window-chips" id="window-chips">
          <!-- populated from payload.weekend_windows at render time -->
        </div>
        <div class="sort-row">
          <label>Sort by
            <select id="sort">
              <option value="price">Cheapest first</option>
              <option value="date">Soonest first</option>
              <option value="country">Country</option>
            </select>
          </label>
          <label class="currency-label">Currency
            <select id="currency">
              <option value="EUR">&euro; EUR</option>
              <option value="GBP">&pound; GBP</option>
              <option value="USD">$ USD</option>
            </select>
          </label>
        </div>
      </div>
      <ol id="deal-list"></ol>
    </aside>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <div id="compare-modal" class="compare-modal" style="display:none;" aria-hidden="true">
    <div class="compare-modal-inner">
      <div class="compare-modal-header">
        <h2>Compare Deals</h2>
        <button id="close-compare" class="compare-close-btn" aria-label="Close comparison">&times;</button>
      </div>
      <div id="compare-grid" class="compare-grid"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="app.js"></script>
</body>
</html>
